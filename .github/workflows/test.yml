name: Test and build
on:
  workflow_call:
  # Pushes to main/master and tag pushes are ALREADY covered: docker.yml runs on
  # them and pulls this workflow in through `workflow_call` for its `verify` job.
  # Without the branches-ignore below, every push to main matched this trigger
  # AND docker.yml's workflow_call, so the whole 6-cell matrix (and its
  # `npm run build`) ran twice per push.
  #
  # Note: because only `branches-ignore` is declared, tag pushes no longer
  # trigger this workflow directly — intentional, they go through docker.yml.
  push:
    branches-ignore:
      - main
      - master
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.19', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: node scripts/download-binaries.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check:native
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-review.mjs
      - run: npm audit
      - run: npm audit
        working-directory: web

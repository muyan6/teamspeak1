name: Test and build
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.19', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: node scripts/download-binaries.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check:native
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-review.mjs
      - run: npm audit
      - run: npm audit
        working-directory: web
